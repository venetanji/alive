# Private software output. No hardware discovery or ALSA modules.
# check_cpal_audio.sh starts a separate policy-only session manager for routing.
context.properties = {
    core.daemon = true
    core.name = ultra-audio-test
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 512
    default.clock.min-quantum = 512
    default.clock.max-quantum = 512
}
context.spa-libs = { support.* = support/libspa-support audio.convert.* = audioconvert/libspa-audioconvert }
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-access args = { access.force = unrestricted } }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    # Policy-only WirePlumber 0.4 does not create/select default nodes.
    { factory = metadata args = {
        metadata.name = default
        metadata.values = [
            { key = default.audio.sink type = "Spa:String:JSON" value = "{\"name\":\"Ultra-Software-Output\"}" }
        ]
    } }
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = Ultra-Test-Driver
        node.group = pipewire.dummy
        priority.driver = 20000
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = Ultra-Software-Output
        node.description = Ultra-Software-Output
        media.class = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
]
