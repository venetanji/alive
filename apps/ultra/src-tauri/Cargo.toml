[package]
name = "ultra"
version = "0.1.0-rc.1"
description = "Ultra Clockwork/Faust research patcher"
authors = ["Alive contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
default-run = "ultra"

[features]
telemetry-disabled = []

[lib]
name = "ultra_desktop"

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
tauri = { version = "=2.8.5", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
quick-xml = "=0.38.4"
cpal = "=0.18.2"
tauri-plugin-dialog = "=2.4.2"
tauri-plugin-single-instance = { version = "=2.3.4", path = "vendor/tauri-plugin-single-instance" }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", features = ["pipewire"] }
gtk = "=0.18.2"
