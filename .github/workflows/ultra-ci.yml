name: Ultra CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Fork PRs execute untrusted source without secrets or repository write access.
permissions:
  contents: read

concurrency:
  group: ultra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  contracts:
    name: UI, protocol, and reference tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: apps/ultra/tests/ci/requirements.txt
      - name: Install pinned schema validator
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r apps/ultra/tests/ci/requirements.txt
      - name: Run deterministic UI, native graph, and recorded-reference tests
        run: bash apps/ultra/tests/ci/check-contracts.sh
      - name: Test desktop diagnostics without a native desktop
        run: |
          python -m unittest discover -s apps/ultra/tests -p test_desktop_timing.py -v
          python -m unittest discover -s apps/ultra/tests -p test_desktop_frames.py -v
          python -m unittest discover -s apps/ultra/tests -p test_desktop_launch_config.py -v
          python -m unittest discover -s apps/ultra/tests -p test_alive_workspace_navigation.py -v
          python -m unittest discover -s apps/ultra/tests -p test_desktop_process_helpers.py -v
          python -m unittest discover -s apps/ultra/tests -p test_slider_help_fixture.py -v

  browser:
    name: Chromium canvas editing smoke
    # Use a supported runner where downloaded Chromium can use its normal
    # user-namespace sandbox without changing Ubuntu 24.04 AppArmor settings.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: apps/ultra/tests/ci/package-lock.json
      - name: Install locked browser test tools
        working-directory: apps/ultra/tests/ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the Playwright-pinned Chromium build
        working-directory: apps/ultra/tests/ci
        run: npx --no-install playwright install --with-deps chromium
      - name: Test real rendered document editing, without a native audio shim
        working-directory: apps/ultra/tests/ci
        run: npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canvas-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/ultra/tests/ci/playwright-report/
            apps/ultra/tests/ci/test-results/
          if-no-files-found: warn
          retention-days: 7

  native:
    name: Linux native build, Rust bridge, and CPAL loopback
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      JOBS: '2'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_RETRY: '2'
      CARGO_HTTP_TIMEOUT: '60'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install official Ubuntu native and Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates unzip xz-utils \
            libjack-jackd2-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            pipewire-bin wireplumber dbus xvfb xauth python3-gi \
            gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core libxtst6 ffmpeg
          ffmpeg -version | head -n 1
          Xvfb -help 2>&1 | head -n 1 || true
          pipewire --version
          wireplumber --version
      - name: Cache downloaded, checksum-verified native dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          # Cache archives, not gigabytes of extracted toolchains/build products.
          # setup.sh rechecks every SHA256 before extraction on each fresh runner.
          path: |
            experiments/clockwork-faust/.deps/*.tar.gz
            experiments/clockwork-faust/.deps/*.tar.xz
            experiments/clockwork-faust/.deps/cargo/registry/cache
            experiments/clockwork-faust/.deps/cargo/registry/index
            experiments/faust-reference/.deps/*.tar.gz
            experiments/faust-reference/.deps/*.zip
          key: ultra-native-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/clockwork-faust/setup.sh', 'experiments/faust-reference/setup.sh', 'apps/ultra/src-tauri/Cargo.lock') }}
      - name: Build actual Clockwork, Faust, and Ultra native engine
        run: bash apps/ultra/build.sh --native-only
      - name: Exercise the compiled native adapter with explicit JACK ABI tests
        run: bash apps/ultra/tests/ci/check-native.sh
      - name: Build and test the real Rust/Tauri bridge
        run: |
          DEPS="$GITHUB_WORKSPACE/experiments/clockwork-faust/.deps"
          export PATH="$DEPS/rust/bin:$PATH"
          export CARGO_HOME="$DEPS/cargo"
          export ULTRA_NATIVE_LIB_DIR="$GITHUB_WORKSPACE/apps/ultra/build"
          export LD_LIBRARY_PATH="$ULTRA_NATIVE_LIB_DIR"
          rustc --version
          cargo test --manifest-path apps/ultra/src-tauri/Cargo.toml --release --locked
          cargo test --manifest-path apps/alive/src-tauri/Cargo.toml --target-dir "$GITHUB_WORKSPACE/apps/ultra/src-tauri/target" --release --locked
          cargo build --manifest-path apps/ultra/src-tauri/Cargo.toml --release --locked
          cargo build --manifest-path apps/alive/src-tauri/Cargo.toml --target-dir "$GITHUB_WORKSPACE/apps/ultra/src-tauri/target" --release --locked
          cp apps/ultra/build/libultra_native.so apps/ultra/src-tauri/target/release/
          python3 apps/ultra/tests/check_app_entrypoints.py

      - name: Render the saved instrument without a desktop or editor
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY \
            LD_LIBRARY_PATH="$GITHUB_WORKSPACE/apps/ultra/build" \
            apps/ultra/src-tauri/target/release/ultra --instrument-probe \
            apps/ultra/examples/subtractive.ultra "$GITHUB_WORKSPACE/apps/ultra/build/instrument-evidence"
      - name: Save authored instrument render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authored-instrument-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/ultra/build/instrument-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Render two saved devices through the headless Alive session host
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY \
            LD_LIBRARY_PATH="$GITHUB_WORKSPACE/apps/ultra/build" \
            apps/ultra/src-tauri/target/release/alive --session-probe \
            apps/alive/examples/two-instruments.alive "$GITHUB_WORKSPACE/apps/ultra/build/session-evidence"
      - name: Save Alive session render and round-trip evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alive-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/ultra/build/session-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Exercise the actual Alive desktop session and hosted editor
        # Provisional diagnostic allowance; runner phase/query evidence must set the permanent bound.
        timeout-minutes: 8
        env:
          ULTRA_TEST_ALIVE: '1'
          ULTRA_TEST_SCRIPT: ${{ github.workspace }}/apps/ultra/tests/check_alive_desktop.py
        run: bash apps/ultra/tests/check_canvas_desktop.sh "$GITHUB_WORKSPACE/apps/ultra/build/session-desktop-evidence"
      - name: Save actual Alive desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alive-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/ultra/build/session-desktop-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Exercise the real Alive Arrangement journey
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        env:
          ULTRA_TEST_ALIVE: '1'
          ULTRA_TEST_SCREEN_SIZE: 1600x1000
          ULTRA_TEST_ALIVE_BINARY: ${{ github.workspace }}/apps/ultra/src-tauri/target/release/alive
          ULTRA_TEST_ALIVE_SESSION: ${{ github.workspace }}/apps/alive/examples/midi-arrangement.alive
          ULTRA_TEST_SCRIPT: ${{ github.workspace }}/apps/ultra/tests/check_alive_arrangement.py
        run: bash apps/ultra/tests/check_canvas_desktop.sh "$GITHUB_WORKSPACE/apps/ultra/build/arrangement-desktop-evidence"
      - name: Save Arrangement evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alive-arrangement-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/ultra/build/arrangement-desktop-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify native clip observation boundaries and failure isolation
        timeout-minutes: 4
        env:
          ULTRA_TEST_ALIVE: '1'
          ULTRA_TEST_SCRIPT: ${{ github.workspace }}/apps/ultra/tests/check_alive_clip_observation.py
        run: |
          python3 apps/ultra/tests/test_alive_clip_observation_failure.py
          bash apps/ultra/tests/check_canvas_desktop.sh "$GITHUB_WORKSPACE/apps/ultra/build/clip-observation-evidence/normal"
          ALIVE_TEST_DISCLOSURE_WRITE_ERROR=1 bash apps/ultra/tests/check_canvas_desktop.sh "$GITHUB_WORKSPACE/apps/ultra/build/clip-observation-evidence/write-error"
          ALIVE_TEST_DISCLOSURE_WRITE_ERROR=1 ALIVE_TEST_DISCLOSURE_BLOCKED=1 bash apps/ultra/tests/check_canvas_desktop.sh "$GITHUB_WORKSPACE/apps/ultra/build/clip-observation-evidence/blocked"
          ALIVE_TEST_DISCLOSURE_INPUT_ERROR=1 bash apps/ultra/tests/check_canvas_desktop.sh "$GITHUB_WORKSPACE/apps/ultra/build/clip-observation-evidence/input-error"
      - name: Save native clip observation boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alive-clip-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/ultra/build/clip-observation-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Exercise saved clips, stream epochs and bounded measurements in Alive
        timeout-minutes: 5
        env:
          ULTRA_TEST_ALIVE: '1'
          ULTRA_TEST_SCRIPT: ${{ github.workspace }}/apps/ultra/tests/check_alive_observability.py
        run: bash apps/ultra/tests/check_canvas_desktop.sh "$GITHUB_WORKSPACE/apps/ultra/build/clip-desktop-evidence"
      - name: Save actual Alive clip evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alive-clips-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/ultra/build/clip-desktop-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Bound hosted editor resources across repeated close and reopen
        timeout-minutes: 4
        env:
          ULTRA_TEST_ALIVE: '1'
          ULTRA_TEST_SCRIPT: ${{ github.workspace }}/apps/ultra/tests/check_alive_editor_resources.py
        run: bash apps/ultra/tests/check_canvas_desktop.sh "$GITHUB_WORKSPACE/apps/ultra/build/editor-resource-evidence"
      - name: Save hosted editor resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alive-editor-resources-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/ultra/build/editor-resource-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Gate real CPAL output through a private software-only PipeWire graph
        timeout-minutes: 5
        run: bash apps/ultra/tests/check_cpal_audio.sh "$GITHUB_WORKSPACE/apps/ultra/build/cpal-evidence"
      - name: Save CPAL loopback evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpal-software-loopback-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/ultra/build/cpal-evidence/
          if-no-files-found: warn
          retention-days: 7
