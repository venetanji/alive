name: Ultra desktop packages

on:
  pull_request:
    paths:
      - 'apps/ultra/**'
      - 'experiments/clockwork-faust/**'
      - 'experiments/faust-reference/**'
      - '.github/workflows/ultra-desktop.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultra-desktop-${{ github.ref }}
  # Superseded PR builds can stop; tag releases are never interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  packages:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # PR/manual builds never enter the signing environment.
    environment: ${{ github.event_name == 'push' && startsWith(matrix.os, 'macos-') && 'desktop-build' || 'desktop-checks' }}
    env:
      JOBS: '2'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_RETRY: '2'
      CARGO_HTTP_TIMEOUT: '60'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
      - name: Validate committed versions and release ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          python apps/ultra/scripts/test_release.py
          if [[ "$EVENT" == push ]]; then
            python apps/ultra/scripts/release.py check-version --tag "$RELEASE_TAG"
            git merge-base --is-ancestor HEAD origin/main
          else
            python apps/ultra/scripts/release.py check-version
          fi
      - name: Install pinned build tools
        run: |
          python -m pip install --disable-pip-version-check cmake==3.31.6
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          rustup target add '${{ matrix.target }}'
          rustc --version
          cmake --version
      - name: Install locked Tauri CLI
        run: npm --prefix apps/ultra/scripts/tooling ci --ignore-scripts --no-audit --no-fund
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64
      - name: Build unsigned or ad-hoc test packages
        if: github.event_name != 'push' || runner.os != 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: python apps/ultra/scripts/release.py build --target '${{ matrix.target }}'
      - name: Build signed and notarized macOS release packages
        if: github.event_name == 'push' && runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash apps/ultra/scripts/sign-macos.sh '${{ matrix.target }}'
      - name: Collect exact target artifacts and checksums
        run: python apps/ultra/scripts/release.py collect --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ultra-${{ matrix.target }}
          path: dist/ultra/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish complete tag release
    needs: packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ultra-*
          path: dist
          merge-multiple: true
      - name: Verify artifact inventory and checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -name 'SHA256SUMS-*.txt' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name 'Ultra-*' | wc -l)" -eq 5
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create release only after all platforms succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Never clobber existing published assets. A retry inspects the draft manually.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its assets.' >&2
            exit 1
          fi
          args=()
          [[ "$RELEASE_TAG" == *-* ]] && args+=(--prerelease)
          gh release create "$RELEASE_TAG" dist/Ultra-* dist/SHA256SUMS.txt \
            --verify-tag --draft --title "Ultra $RELEASE_TAG" --generate-notes "${args[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
